<!doctype html><html lang="en"><meta charset="utf-8"><title>Delivery route playtest</title><link rel="stylesheet" href="../cinematic.css"><style>body{margin:0;background:#101523;color:#dec89d;font:14px monospace}#play{height:calc(100vh - 60px);width:100vw;position:relative;overflow:hidden}#play>canvas:first-child{display:block;width:100%;height:100%;object-fit:contain}.controls{height:60px;display:flex;align-items:center;gap:12px;padding:0 18px;box-sizing:border-box}button{background:#2a2939;color:#e5c898;border:1px solid #7a6854;padding:8px 12px}.minimap-wrap canvas{width:100%;height:100%}body.focus #play{height:100vh}body.focus .controls{display:none}#result{position:absolute;inset:20px;pointer-events:none;color:#e9b79e;z-index:20}</style><div id="play"><canvas tabindex="0"></canvas><div id="result"></div></div><div class="controls"><span>WASD drive · SPACE handbrake · 1 / 2 / 3 job · M map</span><button id="highway">HIGHWAY</button><button id="town">BRIARWICK</button><button id="low">LOW SPEED</button><button id="ghost">ROOKHAVEN</button><button id="bridge">BRIDGES</button><button id="bay">FIRST JOB BAY</button><button id="focus">FOCUS VIEW</button><label><input id="sound" type="checkbox"> SOUND</label></div><script type="module">
import {createDeliveryCity} from '../engine/delivery-world.js';import {createQuestOffers} from '../engine/delivery-jobs.js';import {createDelivery} from '../engine/delivery.js';let game,tick,elapsed=0,last=0;const held=new Set(),pressed=new Set();window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;e.preventDefault();if(!held.has(e.code))pressed.add(e.code);held.add(e.code)});window.addEventListener('keyup',e=>held.delete(e.code));window.addEventListener('blur',()=>{held.clear();pressed.clear()});let canvas=document.querySelector('canvas');function begin(position,seed=431){if(game){clearInterval(tick);game.destroy();const next=canvas.cloneNode();canvas.replaceWith(next);canvas=next}document.querySelector('#result').textContent='';game=createDelivery(canvas,{held:(...codes)=>codes.some(c=>held.has(c)),tap:(...codes)=>codes.some(c=>pressed.has(c))},{paused:()=>false,soundEnabled:()=>document.querySelector('#sound').checked,beep(){},onEnd:r=>document.querySelector('#result').textContent=r.message,toast:console.info},{seed,startPosition:position});last=performance.now();elapsed=0;tick=setInterval(()=>{const now=performance.now();let dt=Math.min(1,(now-last)/1000);last=now;while(dt>0){const step=Math.min(.05,dt);elapsed+=step;game.update(step,elapsed);pressed.clear();dt-=step}game.draw()},33)};document.querySelector('#highway').onclick=()=>begin({x:285,y:8,angle:Math.PI/2});document.querySelector('#town').onclick=()=>begin({x:1103,y:225,angle:0});document.querySelector('#low').onclick=()=>begin({x:3.2,y:225,angle:0});document.querySelector('#ghost').onclick=()=>begin({x:1000,y:1030,angle:Math.PI/2});document.querySelector('#bridge').onclick=()=>begin({x:1100,y:280,angle:Math.PI});document.querySelector('#bay').onclick=()=>{const w=createDeliveryCity(4),s=w.stops.find(s=>s.id==='hollow-chapel');begin({x:s.x,y:s.y,angle:0},4)};document.querySelector('#focus').onclick=()=>{document.body.classList.add('focus');canvas.focus()};begin({x:285,y:8,angle:Math.PI/2});
</script></html>
