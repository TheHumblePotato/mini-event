<!doctype html><html><meta charset="utf-8"><title>Last Ride visual checks</title><link rel="stylesheet" href="../cinematic.css"><style>body{margin:0;background:#111725;color:#d3bea0;font:12px monospace}#play{position:relative;height:calc(100vh - 50px);overflow:hidden}#play>canvas{width:100%;height:100%;object-fit:contain}.controls{display:flex;gap:10px;padding:8px}button{padding:8px;background:#292b3a;color:#dec6a0;border:1px solid #79694e}#result{position:absolute;top:35px;left:20px;z-index:20}</style><div id="play"><canvas tabindex="0"></canvas><div id="result"></div></div><div class="controls"><button id="opening">OPENING</button><button id="powers">POWERUPS</button><button id="engine">ENGINE</button><button id="arrival">ARRIVAL</button><button id="toggle">PLAY / FREEZE</button><span>QA fixture · arrows / space / down · E at platform</span></div><script type="module">
import {createRide} from '../engine/ride.js';import {newRideRun} from '../engine/ride-run.js';let game,canvas=document.querySelector('canvas'),running=false,last=performance.now(),elapsed=0;const held=new Set(),pressed=new Set();window.addEventListener('keydown',e=>{e.preventDefault();if(!held.has(e.code))pressed.add(e.code);held.add(e.code)});window.addEventListener('keyup',e=>held.delete(e.code));window.addEventListener('blur',()=>held.clear());function begin(mode){game?.destroy();const next=canvas.cloneNode();canvas.replaceWith(next);canvas=next;const s=newRideRun({seed:9});s.invulnerable=Infinity;if(mode==='powers')Object.assign(s.powers,{shield:18,magnet:12,double:12});if(mode==='engine'){s.distance=660;s.nextRow=710;s.nextPower=730;s.nextLetter=750}if(mode==='arrival'){s.distance=181;s.nextRow=240;s.letters=new Set('GHOST')}document.querySelector('#result').textContent='';game=createRide(canvas,{held:(...c)=>c.some(k=>held.has(k)),tap:(...c)=>c.some(k=>pressed.has(k))},{paused:()=>false,soundEnabled:()=>false,onEnd:r=>document.querySelector('#result').textContent=r.message,onLetter(){},beep(){},toast:console.info},{testRun:s});running=true;elapsed=0;last=performance.now();canvas.focus()}for(const id of ['opening','powers','engine','arrival'])document.querySelector('#'+id).onclick=()=>begin(id);document.querySelector('#toggle').onclick=()=>running=!running;setInterval(()=>{const now=performance.now();let dt=Math.min(.25,(now-last)/1000);last=now;if(running)while(dt>0){const step=Math.min(.04,dt);elapsed+=step;game.update(step,elapsed);pressed.clear();dt-=step}game?.draw()},33);begin('opening');
</script></html>
