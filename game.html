<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Escape Room</title>
  <link rel="stylesheet" href="game.css" />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share Tech Mono&display=swap" rel="stylesheet" />
</head>
<body>

<!-- ===== TUTORIAL OVERLAY ===== -->
<div id="tutorial-overlay" style="display:none;">
  <div id="tutorial-box">
    <div id="tutorial-step-indicator"></div>
    <div id="tutorial-content"></div>
    <div id="tutorial-buttons">
      <button id="tutorial-skip" class="btn-secondary">Skip</button>
      <button id="tutorial-next" class="btn-primary">Next →</button>
    </div>
  </div>
</div>

<!-- ===== INTRO OVERLAY (first-entry) ===== -->
<div id="intro-overlay" class="hidden">
  <div id="intro-box">
    <div id="intro-icon">🔒</div>
    <div id="intro-text">You find yourself locked in a room.</div>
    <div id="intro-sub">Escape as fast as you can.</div>
    <div id="intro-tap">[ click to dismiss ]</div>
  </div>
</div>

<!-- ===== MAIN GAME UI ===== -->
<div id="game-shell" class="hidden">

  <!-- Top HUD -->
  <div id="top-hud">
    <button id="back-to-hub" class="hud-btn">← Hub</button>
    <div id="room-label">[ <span id="room-name-display">—</span> ]</div>
    <div id="timer-display">⏱ <span id="timer-text">0:00.00</span></div>
  </div>

  <!-- Main area: viewport + sidebar -->
  <div id="main-area">

    <!-- Game Viewport -->
    <div id="game-viewport">
      <canvas id="game-canvas"></canvas>

      <!-- Nav arrows -->
      <button id="nav-left"  class="nav-arrow hidden">◀</button>
      <button id="nav-right" class="nav-arrow hidden">▶</button>
      <button id="nav-up"    class="nav-arrow hidden">▲</button>
      <button id="nav-down"  class="nav-arrow hidden">▼</button>

      <!-- Hover tooltip -->
      <div id="hover-tooltip" class="hidden"></div>
    </div>

    <!-- Side panel area (notice/puzzle/code shown here) -->
    <div id="side-panel-area">
      <!-- Notice / interact popup -->
      <div id="notice-popup" class="side-panel hidden">
        <div class="side-panel-header">
          <span id="notice-title">—</span>
          <button class="panel-close-x" onclick="document.getElementById('notice-popup').classList.add('hidden');window._gameClosePanel&&window._gameClosePanel('notice-popup');">✕</button>
        </div>
        <div id="notice-body" class="side-panel-body"></div>
        <!-- Item use sidebar -->
        <div id="item-use-sidebar" class="item-use-sidebar"></div>
        <div id="notice-actions" class="side-panel-actions"></div>
      </div>

      <!-- Puzzle popup -->
      <div id="puzzle-popup" class="side-panel hidden">
        <div class="side-panel-header">
          <span id="puzzle-title">Puzzle</span>
          <button class="panel-close-x" onclick="document.getElementById('puzzle-popup').classList.add('hidden');window._gameClosePanel&&window._gameClosePanel('puzzle-popup');">✕</button>
        </div>
        <div id="puzzle-body" class="side-panel-body"></div>
      </div>

      <!-- Code popup -->
      <div id="code-popup" class="side-panel hidden">
        <div class="side-panel-header">
          <span id="code-popup-title">Enter Code</span>
          <button class="panel-close-x" onclick="document.getElementById('code-popup').classList.add('hidden');window._gameClosePanel&&window._gameClosePanel('code-popup');">✕</button>
        </div>
        <div id="code-popup-body">
          <div id="code-display"></div>
          <div id="code-keypad"></div>
          <div id="code-feedback"></div>
          <button id="code-submit" class="btn-primary">Confirm</button>
        </div>
      </div>

      <!-- Confirm dialog -->
      <div id="confirm-popup" class="side-panel hidden">
        <div class="side-panel-header"><span>Confirm</span></div>
        <div class="side-panel-body" style="padding:16px;">
          <p id="confirm-message" style="margin-bottom:16px;line-height:1.6;"></p>
          <div style="display:flex;gap:8px;">
            <button id="confirm-yes" class="btn-primary">Yes</button>
            <button id="confirm-no" class="btn-secondary">No</button>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /main-area -->

  <!-- ===== ALWAYS-VISIBLE INVENTORY ===== -->
  <div id="inventory-bar">
    <div id="inventory-label">INVENTORY</div>
    <div id="inventory-grid"></div>
  </div>

</div><!-- /game-shell -->

<!-- ===== ITEM RECEIVED POPUP ===== -->
<div id="item-popup" class="hidden">
  <div id="item-popup-inner">
    <button id="item-popup-close">✕</button>
    <div id="item-popup-icon"></div>
    <div id="item-popup-name"></div>
    <div id="item-popup-desc"></div>
  </div>
</div>

<!-- ===== WIN SCREEN ===== -->
<div id="win-screen" class="hidden">
  <div id="win-box">
    <pre id="win-ascii"></pre>
    <h2 id="win-title">ESCAPED</h2>
    <div id="win-time-display"></div>
    <div id="win-message"></div>
    <div id="win-actions">
      <button id="win-replay" class="btn-secondary">Play Again</button>
      <button id="win-hub" class="btn-secondary">← Hub</button>
    </div>
  </div>
</div>

<!-- Firebase -->

  import { getFirestore, doc, setDoc, getDoc, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyARY96nrH2Aio8rOiLkewSXtTS40TZLrAw",
    authDomain: "nerd-mini-events.firebaseapp.com",
    projectId: "nerd-mini-events",
    storageBucket: "nerd-mini-events.firebasestorage.app",
    messagingSenderId: "974357416633",
    appId: "1:974357416633:web:e190de60553a685d03e968",
    measurementId: "G-V9NGCSEY8J"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  window.firebaseDb = db;
  window.firebaseAuth = auth;
  window.firebaseDoc = doc;
  window.firebaseSetDoc = setDoc;
  window.firebaseGetDoc = getDoc;
  window.firebaseCollection = collection;
  window.firebaseGetDocs = getDocs;
  window.firebaseQuery = query;
  window.firebaseOrderBy = orderBy;
  window.firebaseOnAuthStateChanged = onAuthStateChanged;
  window.firebaseReady = true;
</script>

<script src="game-data.js"></script>
<script src="game.js"></script>



</body>
</html>
