<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Escape Room — April -1st</title>
  <link rel="stylesheet" href="game.css" />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
</head>
<body>

<!-- ===== TUTORIAL OVERLAY ===== -->
<div id="tutorial-overlay">
  <div id="tutorial-box">
    <div id="tutorial-step-indicator"></div>
    <div id="tutorial-content"></div>
    <div id="tutorial-buttons">
      <button id="tutorial-skip" class="btn-secondary">Skip Tutorial</button>
      <button id="tutorial-next" class="btn-primary">Next →</button>
    </div>
  </div>
</div>

<!-- ===== MAIN GAME UI ===== -->
<div id="game-shell" class="hidden">

  <!-- Top HUD -->
  <div id="top-hud">
    <button id="back-to-hub" class="hud-btn">← Hub</button>
    <div id="room-label">ROOM: <span id="room-name-display">—</span></div>
    <div id="timer-display">⏱ <span id="timer-text">00:00</span></div>
    <button id="hud-inventory-btn" class="hud-btn">🎒 Inventory</button>
    <button id="hud-notes-btn" class="hud-btn">📋 Notes</button>
    <button id="hud-hint-btn" class="hud-btn">💡 Hint</button>
  </div>

  <!-- Game viewport -->
  <div id="game-viewport">
    <canvas id="game-canvas"></canvas>

    <!-- Room navigation arrows -->
    <button id="nav-left"  class="nav-arrow hidden">◀</button>
    <button id="nav-right" class="nav-arrow hidden">▶</button>
    <button id="nav-up"    class="nav-arrow hidden">▲</button>
    <button id="nav-down"  class="nav-arrow hidden">▼</button>

    <!-- Interaction tooltip -->
    <div id="hover-tooltip" class="hidden"></div>
  </div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">ESCAPE ROOM</div>
    <div id="objective-box">
      <div class="sidebar-label">OBJECTIVE</div>
      <div id="objective-text">Find a way out.</div>
    </div>
    <div id="quick-log">
      <div class="sidebar-label">LOG</div>
      <div id="log-entries"></div>
    </div>
  </div>
</div>

<!-- ===== INVENTORY PANEL ===== -->
<div id="inventory-panel" class="panel hidden">
  <div class="panel-header">
    <span>🎒 INVENTORY &amp; BULLETIN BOARD</span>
    <button class="panel-close" data-panel="inventory-panel">✕</button>
  </div>
  <div id="inventory-body">
    <!-- Left: item list -->
    <div id="item-list-col">
      <div class="col-label">ITEMS</div>
      <div id="item-slots"></div>
    </div>
    <!-- Right: bulletin board -->
    <div id="bulletin-col">
      <div class="col-label">BULLETIN BOARD</div>
      <div id="bulletin-board">
        <div id="bulletin-canvas-wrap">
          <canvas id="bulletin-canvas"></canvas>
        </div>
        <div id="bulletin-notes"></div>
        <div id="bulletin-toolbar">
          <button class="tool-btn active" data-tool="note">📝 Note</button>
          <button class="tool-btn" data-tool="string">🔗 Connect</button>
          <button class="tool-btn" data-tool="erase">🗑 Erase</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===== NOTES PANEL ===== -->
<div id="notes-panel" class="panel hidden">
  <div class="panel-header">
    <span>📋 NOTES</span>
    <button class="panel-close" data-panel="notes-panel">✕</button>
  </div>
  <textarea id="notes-textarea" placeholder="Type your notes here…&#10;&#10;Clues, codes, observations…"></textarea>
</div>

<!-- ===== INTERACTION POPUP (examine / input) ===== -->
<div id="interact-popup" class="panel hidden">
  <div class="panel-header">
    <span id="interact-title">Object</span>
    <button class="panel-close" data-panel="interact-popup">✕</button>
  </div>
  <div id="interact-body">
    <div id="interact-image-wrap"><img id="interact-image" src="" alt="" /></div>
    <div id="interact-description"></div>
    <div id="interact-controls"></div>
  </div>
</div>

<!-- ===== CODE INPUT POPUP ===== -->
<div id="code-popup" class="panel hidden">
  <div class="panel-header">
    <span id="code-popup-title">Enter Code</span>
    <button class="panel-close" data-panel="code-popup">✕</button>
  </div>
  <div id="code-popup-body">
    <div id="code-display"></div>
    <div id="code-keypad"></div>
    <div id="code-feedback"></div>
    <button id="code-submit" class="btn-primary">Confirm</button>
  </div>
</div>

<!-- ===== PUZZLE POPUP ===== -->
<div id="puzzle-popup" class="panel hidden">
  <div class="panel-header">
    <span id="puzzle-title">Puzzle</span>
    <button class="panel-close" data-panel="puzzle-popup">✕</button>
  </div>
  <div id="puzzle-body"></div>
</div>

<!-- ===== DIALOGUE / NOTICE POPUP ===== -->
<div id="notice-popup" class="panel hidden">
  <div class="panel-header">
    <span id="notice-title">Notice</span>
    <button class="panel-close" data-panel="notice-popup">✕</button>
  </div>
  <div id="notice-body"></div>
  <div id="notice-actions"></div>
</div>

<!-- ===== WIN SCREEN ===== -->
<div id="win-screen" class="hidden">
  <div id="win-box">
    <div id="win-ascii"></div>
    <h2 id="win-title">ESCAPED</h2>
    <div id="win-time-display"></div>
    <div id="win-message"></div>
    <div id="win-actions">
      <button id="win-save" class="btn-primary">Save Time</button>
      <button id="win-replay" class="btn-secondary">Play Again (time won't save)</button>
      <button id="win-hub" class="btn-secondary">← Hub</button>
    </div>
  </div>
</div>

<!-- Firebase -->

  import { getFirestore, doc, setDoc, getDoc, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyARY96nrH2Aio8rOiLkewSXtTS40TZLrAw",
    authDomain: "nerd-mini-events.firebaseapp.com",
    projectId: "nerd-mini-events",
    storageBucket: "nerd-mini-events.firebasestorage.app",
    messagingSenderId: "974357416633",
    appId: "1:974357416633:web:e190de60553a685d03e968",
    measurementId: "G-V9NGCSEY8J"
  };

  const db = getFirestore(app);
  const auth = getAuth(app);
  window.firebaseDb = db;
  window.firebaseAuth = auth;
  window.firebaseDoc = doc;
  window.firebaseSetDoc = setDoc;
  window.firebaseGetDoc = getDoc;
  window.firebaseCollection = collection;
  window.firebaseGetDocs = getDocs;
  window.firebaseQuery = query;
  window.firebaseOrderBy = orderBy;
  window.firebaseOnAuthStateChanged = onAuthStateChanged;
  window.firebaseReady = true;
</script>

<script src="game-data.js"></script>
<script src="game.js"></script>
</body>
</html>
