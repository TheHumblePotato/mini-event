<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Celebrations 2025 - Celebrate the Season</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄️</text></svg>">
    <style>
        /* Prevent layout shift during load */
        html { scroll-behavior: smooth; }
    </style>
</head>
<body>
    <!-- Background canvas for snow and effects -->
    <div id="background-container">
        <canvas id="snow-canvas"></canvas>
        <canvas id="weather-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;"></canvas>
        <div id="stars-container"></div>
        <div id="floating-elements"></div>
    </div>

    <!-- Day/Night cycle overlay -->
    <div id="sky-overlay"></div>
    
    <!-- Sun/Moon display -->
    <div id="celestial-body"></div>

    <!-- Website Background Settings -->
    <div id="bg-settings-btn" class="bg-settings-btn">⚙️</div>
    <div id="bg-settings-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Website Background</h2>
            <p>Choose your preferred background for the main page:</p>
            <div class="designs" id="bg-theme-options">
                <label><input type="radio" name="bg-theme" value="default" checked> <span>Classic</span></label>
                <label><input type="radio" name="bg-theme" value="colorful"> <span>Colorful</span></label>
                <label><input type="radio" name="bg-theme" value="snowy"> <span>Snowy</span></label>
                <label><input type="radio" name="bg-theme" value="aurora"> <span>Aurora</span></label>
                <label><input type="radio" name="bg-theme" value="sunset"> <span>Sunset</span></label>
            </div>
            <div class="modal-buttons">
                <button id="close-bg-settings" class="cancel">Close</button>
            </div>
        </div>
    </div>

    <!-- Corner countdown displays -->
    <div id="countdowns-corners">
        <div class="corner-countdown" id="christmas-corner">
            <div class="corner-icon">🎄</div>
            <div class="corner-title">Christmas</div>
            <div class="corner-display" id="christmas-countdown">--:--:--</div>
        </div>
        <div class="corner-countdown" id="hanukkah-corner">
            <div class="corner-icon">🕯️</div>
            <div class="corner-title">Hanukkah</div>
            <div class="corner-display" id="hanukkah-countdown">--:--:--</div>
        </div>
        <div class="corner-countdown" id="kwanzaa-corner">
            <div class="corner-icon">🐑</div>
            <div class="corner-title">Kwanzaa</div>
            <div class="corner-display" id="kwanzaa-countdown">--:--:--</div>
        </div>
        <div class="corner-countdown" id="newyear-corner">
            <div class="corner-icon">🎆</div>
            <div class="corner-title">New Year</div>
            <div class="corner-display" id="newyear-countdown">--:--:--</div>
        </div>
    </div>

    <!-- Main content -->
    <div id="content-wrapper">
        <!-- Header with title -->
        <header id="main-header">
            <h1 id="main-title">Winter Celebrations 2025</h1>
            <p id="subtitle">Celebrate the Season with your Classmates (NOT FRIENDS)</p>
        </header>

        <!-- Main action button - Decomytree as primary focus -->
        <section id="action-section">
            <button id="decomytree-btn" class="btn btn-primary btn-huge decomytree-detail">
                <span class="btn-emoji">🎄</span>
                <span class="btn-text">Deco My Tree (Lakeside Edition)</span>
                <span class="btn-detail">✨</span>
            </button>
            <!-- Small game links (available) - below main button -->
            <div id="small-games-area">
                <a id="collatz-btn" class="btn btn-secondary btn-game" href="https://lihanfriend.github.io/Collatz-Racing/" target="_blank" rel="noopener noreferrer">
                    <span class="btn-text">Collatz Racing</span>
                </a>
                <a id="hex-btn" class="btn btn-secondary btn-game" href="https://lazypanda5050.github.io/Hexagonal-Chess/" target="_blank" rel="noopener noreferrer">
                    <span class="btn-text">Hexagonal Chess</span>
                </a>
                <a id="aristocrat-btn" class="btn btn-secondary btn-game" href="https://politikl.github.io/aristocrat/" target="_blank" rel="noopener noreferrer">
                    <span class="btn-text">Aristocrat Puzzle</span>
                </a>
            </div>
        </section>
    </div>

    <!-- Ambient particle system overlay -->
    <div id="ambient-particles"></div>

    <script src="index.js"></script>
</body>
</html>
