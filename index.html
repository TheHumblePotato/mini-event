<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>37 Day - Clicker Game</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="background-symbols"></div>
    
    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>
    
    <div class="game-container">
        <!-- Header -->
        <header class="header">
            <h1>✨ 37 Day ✨</h1>
            <p class="subtitle">Embrace the Randomness</p>
            <button id="themeToggle" class="theme-toggle">🌓 Theme</button>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Left side: Clicker -->
            <div class="clicker-section">
                <div class="stats-display">
                    <div class="stat">
                        <span class="stat-label">Randomness</span>
                        <span class="stat-value" id="randomness">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Per Click</span>
                        <span class="stat-value" id="rpc">1</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Per Second</span>
                        <span class="stat-value" id="rps">0</span>
                    </div>
                </div>

                <div class="golden-dice-container" id="goldenDiceContainer">
                    <div class="golden-dice-indicator">🎲 GOLDEN DICE!</div>
                </div>

                <div class="clicker-area">
                    <div class="clicker-symbol" id="clickerSymbol">🎲</div>
                    <div class="click-feedback" id="clickFeedback"></div>
                </div>

                <p class="progress-text" id="progressText">Dice rolling...</p>
                
                <div class="tier-progress">
                    <p style="font-size: 0.85em; color: var(--text-secondary); margin-bottom: 8px;">
                        Tier <span id="currentTier">0</span> - Next at <span id="nextTierTarget">1K</span> Randomness
                    </p>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
            </div>

            <!-- Right side: Shop -->
            <div class="shop-section">
                <div class="shop-header">
                    <h2>Randomness Generators</h2>
                    <div class="tab-buttons">
                        <button class="tab-btn active" data-tab="upgrades">Upgrades</button>
                        <button class="tab-btn" data-tab="buildings">Generators</button>
                    </div>
                </div>

                <!-- Upgrades Tab -->
                <div class="shop-tab active" id="upgrades-tab">
                    <div class="shop-items" id="upgradesList">
                        <!-- Upgraded list populated by JS -->
                    </div>
                </div>

                <!-- Buildings Tab -->
                <div class="shop-tab" id="buildings-tab">
                    <div class="shop-items" id="buildingsList">
                        <!-- Building list populated by JS -->
                    </div>
                </div>

                <!-- Ascension Section -->
                <div class="ascension-section" id="ascensionSection" style="display: none;">
                    <h3>Ascension</h3>
                    <p id="ascensionInfo">Ascension Level: <span id="ascensionLevel">0</span></p>
                    <button id="ascendButton" class="ascend-btn">Ascend</button>
                </div>

                <!-- Minigame Section -->
                <div class="minigame-section" id="minigameSection" style="display: none;">
                    <h3>Lucky Spin</h3>
                    <button id="minigameBtn" class="minigame-btn">Play Mini-Game</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Minigame Modal -->
    <div id="minigameModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Lucky Spin</h2>
            <div class="minigame-wheel" id="minigameWheel">
                <div class="wheel-segment" style="--segment: 0; background: #ff6b6b;">2x</div>
                <div class="wheel-segment" style="--segment: 1; background: #4ecdc4;">3x</div>
                <div class="wheel-segment" style="--segment: 2; background: #45b7d1;">1.5x</div>
                <div class="wheel-segment" style="--segment: 3; background: #96ceb4;">4x</div>
                <div class="wheel-segment" style="--segment: 4; background: #ffeaa7;">5x</div>
                <div class="wheel-segment" style="--segment: 5; background: #dfe6e9;">Lose</div>
            </div>
            <button id="spinButton" class="spin-btn">Spin!</button>
            <p id="minigameResult"></p>
        </div>
    </div>

    <!-- Firebase SDK (compat version for global access) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    
    <!-- Game Script -->
    <script src="index.js"></script>
</body>
</html>
